<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>클라디 학부모 피드백</title>
<style>
  * { box-sizing: border-box; }
  body {
    font-family: -apple-system, BlinkMacSystemFont, "Apple SD Gothic Neo", "Malgun Gothic", sans-serif;
    margin: 0;
    background: #f7f5f2;
    color: #2b2b2b;
  }
  header {
    background: #ffffff;
    padding: 16px 20px;
    border-bottom: 1px solid #e5e0da;
    display: flex;
    justify-content: space-between;
    align-items: center;
  }
  header h1 {
    font-size: 18px;
    margin: 0;
  }
  #logoutBtn, #backBtn {
    background: none;
    border: 1px solid #ccc;
    border-radius: 8px;
    padding: 6px 12px;
    cursor: pointer;
    font-size: 13px;
  }
  main {
    max-width: 640px;
    margin: 0 auto;
    padding: 20px;
  }

  /* 로그인 화면 */
  #loginScreen {
    max-width: 360px;
    margin: 80px auto;
    background: #fff;
    padding: 32px;
    border-radius: 16px;
    box-shadow: 0 2px 12px rgba(0,0,0,0.06);
  }
  #loginScreen h2 { text-align: center; margin-top: 0; }
  #loginScreen input {
    width: 100%;
    padding: 12px;
    margin-bottom: 12px;
    border: 1px solid #ddd;
    border-radius: 8px;
    font-size: 14px;
  }
  #loginScreen button, .primaryBtn {
    width: 100%;
    padding: 12px;
    background: #d98a5f;
    color: white;
    border: none;
    border-radius: 8px;
    font-size: 15px;
    cursor: pointer;
    font-weight: 600;
  }
  #loginError { color: #c0392b; font-size: 13px; margin-top: 8px; text-align: center; }

  /* 학생 목록 (관리자용) */
  .studentCard {
    background: #fff;
    border-radius: 12px;
    padding: 16px;
    margin-bottom: 10px;
    cursor: pointer;
    border: 1px solid #eee;
  }
  .studentCard:hover { border-color: #d98a5f; }

  /* 피드백 카드 */
  .feedbackCard {
    background: #fff;
    border-radius: 12px;
    padding: 16px;
    margin-bottom: 14px;
    border: 1px solid #eee;
  }
  .feedbackMeta {
    font-size: 12px;
    color: #999;
    margin-bottom: 6px;
  }
  .feedbackText {
    font-size: 15px;
    line-height: 1.5;
    white-space: pre-wrap;
  }
  .commentBox {
    margin-top: 12px;
    padding-top: 12px;
    border-top: 1px dashed #eee;
  }
  .comment {
    background: #f7f5f2;
    border-radius: 8px;
    padding: 8px 12px;
    margin-bottom: 6px;
    font-size: 13px;
  }
  .comment b { color: #d98a5f; }
  .commentInputRow {
    display: flex;
    gap: 6px;
    margin-top: 8px;
  }
  .commentInputRow input {
    flex: 1;
    padding: 8px 10px;
    border: 1px solid #ddd;
    border-radius: 8px;
    font-size: 13px;
  }
  .commentInputRow button {
    padding: 8px 12px;
    background: #2b2b2b;
    color: white;
    border: none;
    border-radius: 8px;
    font-size: 13px;
    cursor: pointer;
  }

  /* 새 피드백 작성 (관리자용) */
  #newFeedbackBox {
    background: #fff;
    border-radius: 12px;
    padding: 16px;
    margin-bottom: 20px;
    border: 1px solid #eee;
  }
  #newFeedbackBox textarea {
    width: 100%;
    min-height: 80px;
    padding: 10px;
    border: 1px solid #ddd;
    border-radius: 8px;
    font-size: 14px;
    resize: vertical;
    margin-bottom: 8px;
    font-family: inherit;
  }

  .hidden { display: none !important; }
  #loadingText { text-align: center; color: #999; padding: 40px; }
</style>
</head>
<body>

<div id="loginScreen">
  <h2>클라디 학부모 피드백</h2>
  <input type="email" id="emailInput" placeholder="이메일" autocomplete="username">
  <input type="password" id="passwordInput" placeholder="비밀번호" autocomplete="current-password">
  <button id="loginBtn">로그인</button>
  <div id="loginError"></div>
</div>

<div id="appScreen" class="hidden">
  <header>
    <h1 id="headerTitle">클라디 학부모 피드백</h1>
    <div>
      <button id="backBtn" class="hidden">목록으로</button>
      <button id="logoutBtn">로그아웃</button>
    </div>
  </header>
  <main>
    <div id="loadingText" class="hidden">불러오는 중...</div>

    <!-- 관리자: 학생 목록 -->
    <div id="studentListView" class="hidden"></div>

    <!-- 학생별 피드백 화면 (관리자 + 학부모 공용) -->
    <div id="feedbackView" class="hidden">
      <div id="newFeedbackBox" class="hidden">
        <textarea id="newFeedbackText" placeholder="오늘 수업 특이사항을 적어주세요..."></textarea>
        <button class="primaryBtn" id="postFeedbackBtn">피드백 올리기</button>
      </div>
      <div id="feedbackList"></div>
    </div>
  </main>
</div>

<!-- Firebase SDK (compat 버전 - 별도 빌드 도구 없이 바로 사용 가능) -->
<script src="https://www.gstatic.com/firebasejs/10.13.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.13.0/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.13.0/firebase-firestore-compat.js"></script>

<script>
  // ===== Firebase 설정 =====
  const firebaseConfig = {
    apiKey: "AIzaSyDCQElEVNAiKtNU0kF7IPkJq1opMipTbT8",
    authDomain: "kladiyk.firebaseapp.com",
    projectId: "kladiyk",
    storageBucket: "kladiyk.firebasestorage.app",
    messagingSenderId: "69460247683",
    appId: "1:69460247683:web:8e292703680ca39f8d07b6",
    measurementId: "G-14882H4E6N"
  };
  firebase.initializeApp(firebaseConfig);
  const auth = firebase.auth();
  const db = firebase.firestore();

  const ADMIN_EMAIL = "celeste@kladi.com";

  let currentUser = null;
  let currentStudentId = null; // 관리자가 지금 보고 있는 학생, 또는 학부모 본인 자녀
  let isAdmin = false;

  // ===== DOM =====
  const loginScreen = document.getElementById('loginScreen');
  const appScreen = document.getElementById('appScreen');
  const emailInput = document.getElementById('emailInput');
  const passwordInput = document.getElementById('passwordInput');
  const loginBtn = document.getElementById('loginBtn');
  const loginError = document.getElementById('loginError');
  const logoutBtn = document.getElementById('logoutBtn');
  const backBtn = document.getElementById('backBtn');
  const headerTitle = document.getElementById('headerTitle');
  const loadingText = document.getElementById('loadingText');
  const studentListView = document.getElementById('studentListView');
  const feedbackView = document.getElementById('feedbackView');
  const newFeedbackBox = document.getElementById('newFeedbackBox');
  const newFeedbackText = document.getElementById('newFeedbackText');
  const postFeedbackBtn = document.getElementById('postFeedbackBtn');
  const feedbackList = document.getElementById('feedbackList');

  // ===== 로그인 =====
  loginBtn.addEventListener('click', () => {
    loginError.textContent = '';
    const email = emailInput.value.trim();
    const pw = passwordInput.value;
    if (!email || !pw) {
      loginError.textContent = '이메일과 비밀번호를 입력해주세요.';
      return;
    }
    auth.signInWithEmailAndPassword(email, pw).catch(err => {
      loginError.textContent = '로그인 실패: 이메일 또는 비밀번호를 확인해주세요.';
    });
  });

  logoutBtn.addEventListener('click', () => auth.signOut());

  backBtn.addEventListener('click', () => {
    currentStudentId = null;
    feedbackView.classList.add('hidden');
    backBtn.classList.add('hidden');
    showStudentList();
  });

  auth.onAuthStateChanged(async (user) => {
    if (user) {
      currentUser = user;
      isAdmin = (user.email === ADMIN_EMAIL);
      loginScreen.classList.add('hidden');
      appScreen.classList.remove('hidden');
      if (isAdmin) {
        showStudentList();
      } else {
        // 학부모: 본인 자녀 학생 문서를 parentUid로 찾기
        loadingText.classList.remove('hidden');
        const snap = await db.collection('students').where('parentUid', '==', user.uid).get();
        loadingText.classList.add('hidden');
        if (snap.empty) {
          feedbackList.innerHTML = '<p>연결된 학생 정보가 없습니다. 원장님께 문의해주세요.</p>';
          feedbackView.classList.remove('hidden');
        } else {
          const doc = snap.docs[0];
          currentStudentId = doc.id;
          headerTitle.textContent = doc.data().name + ' 학생 피드백';
          openFeedbackView(false);
        }
      }
    } else {
      currentUser = null;
      loginScreen.classList.remove('hidden');
      appScreen.classList.add('hidden');
    }
  });

  // ===== 관리자: 학생 목록 =====
  async function showStudentList() {
    headerTitle.textContent = '학생 목록';
    feedbackView.classList.add('hidden');
    backBtn.classList.add('hidden');
    studentListView.classList.remove('hidden');
    loadingText.classList.remove('hidden');
    studentListView.innerHTML = '';

    const snap = await db.collection('students').orderBy('name').get();
    loadingText.classList.add('hidden');

    if (snap.empty) {
      studentListView.innerHTML = '<p>등록된 학생이 없습니다. Firestore 콘솔의 "students" 컬렉션에서 학생을 추가해주세요.</p>';
      return;
    }
    snap.forEach(doc => {
      const div = document.createElement('div');
      div.className = 'studentCard';
      div.textContent = doc.data().name;
      div.addEventListener('click', () => {
        currentStudentId = doc.id;
        headerTitle.textContent = doc.data().name + ' 학생 피드백';
        studentListView.classList.add('hidden');
        backBtn.classList.remove('hidden');
        openFeedbackView(true);
      });
      studentListView.appendChild(div);
    });
  }

  // ===== 피드백 화면 =====
  function openFeedbackView(showComposer) {
    feedbackView.classList.remove('hidden');
    newFeedbackBox.classList.toggle('hidden', !showComposer);
    loadFeedbacks();
  }

  postFeedbackBtn.addEventListener('click', async () => {
    const text = newFeedbackText.value.trim();
    if (!text || !currentStudentId) return;
    postFeedbackBtn.disabled = true;
    await db.collection('students').doc(currentStudentId).collection('feedbacks').add({
      text: text,
      author: currentUser.email,
      createdAt: firebase.firestore.FieldValue.serverTimestamp()
    });
    newFeedbackText.value = '';
    postFeedbackBtn.disabled = false;
    loadFeedbacks();
  });

  async function loadFeedbacks() {
    feedbackList.innerHTML = '<div id="loadingText">불러오는 중...</div>';
    const snap = await db.collection('students').doc(currentStudentId)
      .collection('feedbacks').orderBy('createdAt', 'desc').get();

    feedbackList.innerHTML = '';
    if (snap.empty) {
      feedbackList.innerHTML = '<p>아직 등록된 피드백이 없습니다.</p>';
      return;
    }

    for (const doc of snap.docs) {
      const data = doc.data();
      const card = document.createElement('div');
      card.className = 'feedbackCard';

      const dateStr = data.createdAt ? data.createdAt.toDate().toLocaleString('ko-KR') : '';
      card.innerHTML = `
        <div class="feedbackMeta">${dateStr} · ${data.author}</div>
        <div class="feedbackText"></div>
        <div class="commentBox">
          <div class="commentsHolder"></div>
          <div class="commentInputRow">
            <input type="text" placeholder="댓글을 남겨보세요...">
            <button>답글</button>
          </div>
        </div>
      `;
      card.querySelector('.feedbackText').textContent = data.text;
      feedbackList.appendChild(card);

      const commentsHolder = card.querySelector('.commentsHolder');
      const commentInput = card.querySelector('.commentInputRow input');
      const commentBtn = card.querySelector('.commentInputRow button');

      loadComments(doc.id, commentsHolder);

      commentBtn.addEventListener('click', async () => {
        const text = commentInput.value.trim();
        if (!text) return;
        commentBtn.disabled = true;
        await db.collection('students').doc(currentStudentId)
          .collection('feedbacks').doc(doc.id).collection('comments').add({
            text: text,
            author: currentUser.email,
            createdAt: firebase.firestore.FieldValue.serverTimestamp()
          });
        commentInput.value = '';
        commentBtn.disabled = false;
        loadComments(doc.id, commentsHolder);
      });
    }
  }

  async function loadComments(feedbackId, holderEl) {
    holderEl.innerHTML = '';
    const snap = await db.collection('students').doc(currentStudentId)
      .collection('feedbacks').doc(feedbackId).collection('comments')
      .orderBy('createdAt', 'asc').get();
    snap.forEach(doc => {
      const data = doc.data();
      const div = document.createElement('div');
      div.className = 'comment';
      const nameTag = data.author === ADMIN_EMAIL ? '선생님' : '학부모님';
      div.innerHTML = `<b>${nameTag}</b> `;
      div.appendChild(document.createTextNode(data.text));
      holderEl.appendChild(div);
    });
  }
</script>
</body>
</html>
